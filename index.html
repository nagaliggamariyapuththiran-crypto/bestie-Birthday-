<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Abinaya ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  font-family:Arial,sans-serif;
  color:#fff;
  overflow-x:hidden;
}

/* =========================
   BLACK SPACE
========================= */

.space{
  position:fixed;
  inset:0;
  background:#000;
  overflow:hidden;
  z-index:-5;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:#FFD700;
  border-radius:50%;
  box-shadow:0 0 6px #FFD700;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{
    opacity:.2;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1.5);
  }
}

/* =========================
   INTRO
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.introStar{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#FFD700;
  box-shadow:0 0 8px #FFD700;
  animation:introStarMove 4s linear infinite;
}

@keyframes introStarMove{
  from{
    transform:translateY(0) scale(.5);
    opacity:.2;
  }
  to{
    transform:translateY(100vh) scale(1.5);
    opacity:1;
  }
}

/* GOLD HEART */

.heart{
  position:relative;
  width:90px;
  height:90px;
  background:#FFD700;
  transform:rotate(-45deg);
  box-shadow:
    0 0 15px #FFD700,
    0 0 35px #FFD700,
    0 0 70px #FFB300;
  animation:heartShow 4.8s ease-in-out forwards;
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  background:#FFD700;
  border-radius:50%;
}

.heart:before{
  top:-45px;
  left:0;
}

.heart:after{
  left:45px;
  top:0;
}

@keyframes heartShow{
  0%{
    transform:rotate(-45deg) scale(.05);
    opacity:0;
  }

  20%{
    transform:rotate(-45deg) scale(.8);
    opacity:1;
  }

  45%{
    transform:rotate(-45deg) scale(1.1);
  }

  60%{
    transform:rotate(-45deg) scale(.95);
  }

  100%{
    transform:rotate(-45deg) scale(10);
    opacity:0;
  }
}

.introText{
  position:absolute;
  top:70%;
  text-align:center;
  color:#FFD700;
  font-size:16px;
  font-weight:bold;
  letter-spacing:3px;
  line-height:1.8;
  text-shadow:
    0 0 10px #FFD700,
    0 0 25px #FFD700;
  animation:textAppear 1.5s ease forwards;
}

@keyframes textAppear{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   SCREENS
========================= */

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.screen.active{
  display:flex;
}

/* =========================
   CARD
========================= */

.card{
  width:min(94vw,460px);
  max-height:94vh;
  overflow:auto;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:rgba(0,0,0,.82);
  border:1px solid rgba(255,215,0,.35);
  box-shadow:
    0 0 30px rgba(255,215,0,.08),
    0 20px 70px #000;
}

h1{
  font-size:28px;
  color:#fff;
}

.sub{
  color:#eee;
  line-height:1.7;
}

/* =========================
   GOLD BUTTON
========================= */

.btn,
.opt{
  border:1px solid #FFD700;
  border-radius:18px;
  padding:14px 18px;
  margin:7px;
  background:#050505;
  color:#FFD700;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px rgba(255,215,0,.12);
  transition:.2s;
}

.btn:hover,
.opt:hover{
  background:#171300;
  box-shadow:
    0 0 15px #FFD700,
    0 0 30px rgba(255,215,0,.25);
  transform:translateY(-2px);
}

.btn:active,
.opt:active{
  transform:scale(.95);
}

.btn:disabled{
  opacity:.4;
}

.opt{
  display:block;
  width:100%;
  text-align:left;
}

.opt.selected{
  background:#3d3100;
  box-shadow:0 0 18px rgba(255,215,0,.4);
}

/* =========================
   GIFT
========================= */

.gift{
  font-size:75px;
  animation:gift 1.5s infinite;
}

@keyframes gift{
  50%{
    transform:translateY(-10px) rotate(3deg);
  }
}

/* =========================
   COUNTDOWN
========================= */

.count{
  font-size:110px;
  font-weight:1000;
  color:#FFD700;
  text-shadow:
    0 0 15px #FFD700,
    0 0 40px #FFD700;
}

/* =========================
   PHOTO
========================= */

.photo{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:20px;
  margin:10px 0;
}

/* =========================
   LETTER
========================= */

.letter{
  text-align:left;
  line-height:1.75;
  font-size:15px;
}

/* =========================
   CAKE
========================= */

.cake{
  font-size:110px;
  animation:cakeMove 1.5s infinite;
}

@keyframes cakeMove{
  50%{
    transform:translateY(-10px);
  }
}

/* =========================
   FLAME
========================= */

.flame{
  font-size:70px;
  filter:
    drop-shadow(0 0 10px #FFD700)
    drop-shadow(0 0 25px #FFB300);
  transition:1s;
}

.flame.off{
  transform:scale(0);
  opacity:0;
}

/* =========================
   BALLOONS
========================= */

#balloonBox{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin:20px 0;
}

.balloon{
  font-size:45px;
  cursor:pointer;
  user-select:none;
  filter:drop-shadow(0 0 7px #FFD700);
}

.balloon.pop{
  animation:pop .5s forwards;
}

@keyframes pop{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.7);
  }
  100%{
    transform:scale(0);
    opacity:0;
  }
}

/* =========================
   BIRTHDAY WISH
========================= */

.wish{
  font-size:38px;
  font-weight:1000;
  line-height:1.4;
  color:#FFD700;
  text-shadow:
    0 0 10px #FFD700,
    0 0 25px #FFD700,
    0 0 50px #FFB300;
  animation:wish 1.2s ease;
}

@keyframes wish{
  from{
    transform:scale(0);
    opacity:0;
  }
  70%{
    transform:scale(1.15);
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   TEDDY
========================= */

.teddy{
  font-size:115px;
  animation:teddy 1.5s infinite;
}

@keyframes teddy{
  50%{
    transform:translateY(-12px);
  }
}

/* =========================
   CONFETTI
========================= */

.confetti{
  position:fixed;
  top:-30px;
  z-index:10000;
  font-size:25px;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

/* =========================
   FINAL
========================= */

.finalEmoji{
  font-size:65px;
  animation:finalPop 1.2s ease;
}

@keyframes finalPop{
  from{
    transform:scale(0);
    opacity:0;
  }
  60%{
    transform:scale(1.2);
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.bye{
  margin-top:20px;
  font-size:55px;
  font-weight:1000;
  color:#FFD700;
  text-shadow:
    0 0 12px #FFD700,
    0 0 30px #FFD700;
}

</style>
</head>
