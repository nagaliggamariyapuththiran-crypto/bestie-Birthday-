<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Abinaya 💜</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:system-ui,sans-serif;
  background:#05000d;
  color:white;
  overflow-x:hidden;
}

/* ===== SPACE BACKGROUND ===== */

.space{
  position:fixed;
  inset:0;
  z-index:-10;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#431060 0%,#160522 38%,#05000d 80%);
}

.stars,
.stars2,
.stars3{
  position:absolute;
  inset:-50%;
  width:200%;
  height:200%;
  background-repeat:repeat;
  pointer-events:none;
}

.stars{
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px);
  background-size:75px 75px;
  animation:moveStars 35s linear infinite;
  opacity:.75;
}

.stars2{
  background-image:
    radial-gradient(circle,#dcb7ff 1.2px,transparent 1.8px);
  background-size:120px 120px;
  animation:moveStars 55s linear infinite reverse;
  opacity:.55;
}

.stars3{
  background-image:
    radial-gradient(circle,#fff 1.5px,transparent 2px);
  background-size:190px 190px;
  animation:twinkle 2.5s ease-in-out infinite alternate;
  opacity:.7;
}

@keyframes moveStars{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(-120px,80px);
  }
}

@keyframes twinkle{
  from{
    opacity:.25;
  }
  to{
    opacity:1;
  }
}

/* ===== SCREENS ===== */

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  position:relative;
}

.active{
  display:flex;
}

/* ===== CARD ===== */

.card{
  width:min(94vw,460px);
  max-height:94vh;
  overflow:auto;
  text-align:center;
  padding:25px;
  border-radius:30px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(15px);
  box-shadow:
    0 20px 70px rgba(0,0,0,.7),
    0 0 35px rgba(168,91,223,.2);
}

h1{
  font-size:29px;
  margin-top:10px;
}

.sub{
  line-height:1.6;
  color:#eadcf4;
}

/* ===== BUTTONS ===== */

.btn,
.opt{
  border:0;
  border-radius:18px;
  padding:14px 18px;
  margin:7px;
  background:linear-gradient(135deg,#a85bdf,#7130a5);
  color:white;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 7px 20px rgba(0,0,0,.3);
  transition:.2s;
}

.btn:hover,
.opt:hover{
  transform:translateY(-2px) scale(1.02);
}
